# 管理后台静态托管示例（非容器化部署）
#
# 1. cd admin && npm ci && npm run build
# 2. 将 admin/dist 上传到 /var/www/feedbacker-admin
# 3. 使用本配置启动 Nginx
#
# 后台以相对路径 /api 访问接口，由下面的 location /api/ 代理到后端，
# 前后端同源，无需额外配置 API 地址或 CORS。

server {
    listen 80;
    server_name feedback-admin.example.com;

    root /var/www/feedbacker-admin;
    index index.html;

    # 同域转发 API 请求
    location /api/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带 hash 的静态资源可长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
