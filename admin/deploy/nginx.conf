# 管理后台静态站点（1Panel）示例配置
#
# 部署形态：后台页面 feedbackeradmin.vodyanitsa.top，接口 feedback.glassous.top，
# 两者不同源，接口地址在构建时由 VITE_API_BASE_URL 注入，跨域由后端 CORS_ORIGINS 放行。
#
# 1Panel 的静态站点由面板生成，实际需要改的只有 root + SPA 回退：
#   1Panel → 网站 → feedbackeradmin.vodyanitsa.top → 配置 → 网站目录：
#     改为 /opt/1panel/www/sites/feedbackeradmin.vodyanitsa.top/index/dist
#   或直接编辑 /opt/1panel/apps/openresty/openresty/conf/conf.d/<域名>.conf（Nginx 则在
#   /opt/1panel/apps/nginx/nginx/conf/conf.d/），保存后由面板校验并重载（未生效时在「应用」里重启 OpenResty）。
#
# 开启 SSL 后 1Panel 会生成 443 的 server 块，沿用同一个 root 即可，无需重复配置。

server {
    listen 80;
    server_name feedbackeradmin.vodyanitsa.top;

    root /opt/1panel/www/sites/feedbackeradmin.vodyanitsa.top/index/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带 hash 的静态资源可长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口文件禁止缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退，否则刷新 /settings 之类的前端路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 可选：若不想跨域，把下面的注释打开，并将构建变量改为 VITE_API_BASE_URL=/api
    # location /api/ {
    #     proxy_pass https://feedback.glassous.top;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host feedback.glassous.top;
    #     proxy_ssl_server_name on;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
