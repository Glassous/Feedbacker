name: Backend

# 云端构建镜像并推送到 GHCR，再通过 SSH 让服务器拉取重启。
# 服务器上不做任何编译。
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/docker-compose.prod.yml"
      - "deploy/deploy-backend.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # 服务器架构为 ARM 时改为 linux/arm64
  PLATFORMS: linux/amd64
  APP_DIR: /opt/feedbacker
  SSH_HOST_ALIAS: feedbacker-prod

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算镜像地址
        id: meta
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入摘要
        run: |
          echo "镜像: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host ${SSH_HOST_ALIAS}
            HostName ${SERVER_HOST}
            User ${SERVER_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: 上传部署脚本
        run: |
          set -euo pipefail
          scp -q deploy/deploy-backend.sh deploy/docker-compose.prod.yml "${SSH_HOST_ALIAS}:/tmp/"

      - name: 远端登录 GHCR（私有包需要）
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh "$SSH_HOST_ALIAS" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" \
            || echo "::warning::远端 GHCR 登录失败；若镜像包为私有，拉取会失败"

      - name: 拉取镜像并重启
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          ssh "$SSH_HOST_ALIAS" "bash /tmp/deploy-backend.sh '${IMAGE}' '${APP_DIR}'"

      - name: 清理远端凭据
        if: always()
        run: |
          ssh -o ConnectTimeout=10 "$SSH_HOST_ALIAS" "docker logout ghcr.io" >/dev/null 2>&1 || true
